<title>EcoLoop · Pickups et véhicules</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout concept: a calm environmental-tech shell. Public landing page, a rounded light citizen app, and a denser dark-sidebar admin console. */
:root {
  --forest: #123D35; --green: #2D8C74; --lime: #A8E063;
  --bg: #F6F9F7; --surface: #FFFFFF; --surface-2: #EDF4F0; --fg: #1F2937; --muted: #566761; --line: #DCE7E2;
  --accent-text: #1F7A63; --btn: #237A64; --btn-h: #1B6553; --on-btn: #FFFFFF;
  --nav-on: #123D35; --nav-on-fg: #FFFFFF; --chip-on: #123D35; --chip-on-fg: #FFFFFF;
  --tip-bg: #123D35; --tip-fg: #FFFFFF;
  --ok: #1E7F52; --ok-bg: #E1F3E9; --warn: #96600A; --warn-bg: #FAEFD6; --bad: #B8372F; --bad-bg: #FBE4E1; --info: #2B62A8; --info-bg: #E3EEFA; --mute-bg: #E8EFEC;
  --c-plastic: #3B82F6; --c-paper: #E59A12; --c-glass: #12A89A; --c-metal: #8393A7; --c-organic: #6DB33F; --c-electronics: #8B5CF6;
  --map-bg: #E4EEE9; --map-block: #F7FAF8; --map-park: #CBE6C0; --map-water: #BCDCEB; --map-road: #FBE7B4;
  --adm-bg: #F0F4F2; --a-side: #0E2F29;
  --shadow: 0 1px 2px rgba(18,61,53,.06), 0 10px 28px rgba(18,61,53,.07);
  --font-d: 'Poppins', 'Segoe UI', system-ui, sans-serif; --font-b: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1A17; --surface: #102923; --surface-2: #17362F; --fg: #E5F0EC; --muted: #9DB6AE; --line: #214238;
    --accent-text: #7FDDB9; --btn: #A8E063; --btn-h: #BDEB86; --on-btn: #123D35;
    --nav-on: #1F5A4B; --chip-on: #A8E063; --chip-on-fg: #123D35; --tip-bg: #E5F0EC; --tip-fg: #0A1A17;
    --ok: #6FD39C; --ok-bg: #12382B; --warn: #F2B955; --warn-bg: #3A2F12; --bad: #FF9088; --bad-bg: #40201E; --info: #8DB8F2; --info-bg: #172B47; --mute-bg: #1B2F2A;
    --map-bg: #123029; --map-block: #1A3D34; --map-park: #1F4A35; --map-water: #1B4458; --map-road: #4A4126;
    --adm-bg: #08130F; --a-side: #06100D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1A17; --surface: #102923; --surface-2: #17362F; --fg: #E5F0EC; --muted: #9DB6AE; --line: #214238;
  --accent-text: #7FDDB9; --btn: #A8E063; --btn-h: #BDEB86; --on-btn: #123D35;
  --nav-on: #1F5A4B; --chip-on: #A8E063; --chip-on-fg: #123D35; --tip-bg: #E5F0EC; --tip-fg: #0A1A17;
  --ok: #6FD39C; --ok-bg: #12382B; --warn: #F2B955; --warn-bg: #3A2F12; --bad: #FF9088; --bad-bg: #40201E; --info: #8DB8F2; --info-bg: #172B47; --mute-bg: #1B2F2A;
  --map-bg: #123029; --map-block: #1A3D34; --map-park: #1F4A35; --map-water: #1B4458; --map-road: #4A4126;
  --adm-bg: #08130F; --a-side: #06100D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-b); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 90; }
h1, h2, h3, h4 { font-family: var(--font-d); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -.01em; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
button { font-family: inherit; }
ul, ol { margin: 0; padding: 0; }
.muted { color: var(--muted); } .sm { font-size: 13.5px; } .xs { font-size: 12px; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; } .between { justify-content: space-between; }
.gap-top { margin-top: 18px; } .pad-s { padding: 14px; }
.icon-btn.menu-only, .menu-only { display: none; }

/* Buttons and controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 10px 18px; font: 600 14px var(--font-b); cursor: pointer; transition: background .15s, border-color .15s, transform .15s; text-decoration: none; white-space: nowrap; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--btn); color: var(--on-btn); } .btn-primary:hover:not(:disabled) { background: var(--btn-h); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--fg); } .btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-lime { background: var(--lime); color: var(--forest); } .btn-lime:hover { background: #BCEB82; }
.btn-outline-light { border-color: rgba(255,255,255,.5); color: #fff; } .btn-outline-light:hover { background: rgba(255,255,255,.1); }
.btn-sm { padding: 6px 13px; font-size: 13px; } .btn-lg { padding: 14px 26px; font-size: 15px; } .btn-block { width: 100%; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.on-dark { background: transparent; border-color: rgba(255,255,255,.2); color: #fff; }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); font: 600 14px var(--font-b); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.link:hover { text-decoration: underline; }
input, select, textarea { width: 100%; font: 400 14.5px var(--font-b); padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
textarea { resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
input[type=radio] { width: auto; accent-color: var(--green); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-weight: 600; font-size: 13.5px; }
.err { color: var(--bad); font-size: 13px; } .hint { color: var(--muted); font-size: 12.5px; }
.label { font: 600 12px var(--font-b); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font: 600 13px var(--font-b); color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.toggle { width: 44px; height: 26px; border-radius: 99px; border: 0; background: var(--line); padding: 3px; cursor: pointer; flex: none; transition: background .15s; }
.toggle span { display: block; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle.on { background: var(--green); } .toggle.on span { transform: translateX(18px); }
.progress { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), var(--lime)); transition: width .4s; }
.progress.lime { background: rgba(255,255,255,.18); } .progress.lime > div { background: var(--lime); }
.progress.bad > div { background: var(--bad); } .progress.warn > div { background: #E59A12; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font: 600 12px var(--font-b); white-space: nowrap; }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); } .b-bad { background: var(--bad-bg); color: var(--bad); } .b-info { background: var(--info-bg); color: var(--info); } .b-mute { background: var(--mute-bg); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cat { --c: var(--green); display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font: 500 13px var(--font-b); color: var(--fg); background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); white-space: nowrap; }
.cat svg { color: var(--c); }
.cat-sm { padding: 3px 9px; font-size: 12px; }
.cat-btn { cursor: pointer; } .cat-btn:hover { background: color-mix(in srgb, var(--c) 24%, var(--surface)); }
.cat.on { background: color-mix(in srgb, var(--c) 28%, var(--surface)); box-shadow: 0 0 0 2px var(--c); font-weight: 600; }
.demo-note { display: flex; gap: 10; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--info-bg); border: 1px dashed color-mix(in srgb, var(--info) 45%, transparent); font-size: 13.5px; }
.demo-note svg { color: var(--info); flex: none; margin-top: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 22px; }
.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }

/* Grids */
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.g5 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.two, .a-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.a-two { margin-top: 16px; gap: 16px; } .a-two > .acard { margin-top: 0; }
.impact-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.top-al { align-items: start; }
@media (max-width: 1000px) { .two, .a-two, .impact-grid { grid-template-columns: minmax(0, 1fr); } }

/* Charts and maps */
.chart { width: 100%; height: auto; display: block; }
.gl { stroke: var(--line); stroke-width: 1; }
.ax { fill: var(--muted); font: 500 11px var(--font-b); }
.tip-bg { fill: var(--tip-bg); } .tip-t { fill: var(--tip-fg); font: 500 12px var(--font-b); } .tip-t.b { font-weight: 700; }
.donut-n { fill: var(--fg); font: 700 26px var(--font-d); }
.chart [tabindex]:focus-visible { outline: 2px solid var(--green); }
.donut-wrap { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: center; }
.donut { flex: none; max-width: 100%; }
.legend { list-style: none; display: grid; gap: 4px; flex: 1; min-width: 160px; }
.legend li { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 8px; font-size: 14px; }
.legend li.on { background: var(--surface-2); } .legend b { margin-left: auto; font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.map { margin: 0; } .map figcaption { color: var(--muted); font-size: 12px; margin-top: 8px; }
.mk { cursor: pointer; } .mk:focus-visible circle:last-of-type { stroke: var(--forest); }
.legend-row { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 13px; margin-top: 10px; }
.legend-row i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(6,18,15,.58); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s; }
.modal { width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.modal-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 22px 0; } .modal-b { padding: 16px 22px 22px; }
.modal-f { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
.drawer-o { place-items: stretch end; padding: 0; }
.drawer { width: min(460px, 100%); height: 100%; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: slide .2s; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 18px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.toasts { position: fixed; z-index: 200; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 8px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; max-width: min(420px, 100%); background: var(--forest); color: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.3); font-size: 14px; animation: rise .2s; }
.toast svg { color: var(--lime); flex: none; } .toast.bad { background: #7A2420; } .toast.bad svg { color: #FFC1BB; }
@keyframes fade { from { opacity: 0; } } @keyframes slide { from { transform: translateX(30px); opacity: 0; } } @keyframes rise { from { transform: translateY(10px); opacity: 0; } }

/* Logo */
.logo { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: inherit; }
button.logo { cursor: pointer; }
.logo-word { font: 700 21px var(--font-d); letter-spacing: -.02em; color: var(--fg); }

/* Landing */
.lnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.lnav-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; }
.lnav-links { display: flex; gap: 4px; } .lnav-links button { border: 0; background: none; padding: 8px 14px; border-radius: 99px; font: 500 14.5px var(--font-b); color: var(--muted); cursor: pointer; } .lnav-links button:hover { background: var(--surface-2); color: var(--fg); }
.lnav-act { display: flex; align-items: center; gap: 10px; }
.lnav-m { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 0 18px; } .lnav-m-l { text-align: left; background: none; border: 0; padding: 10px 0; font: 500 16px var(--font-b); color: var(--fg); cursor: pointer; }
section[id] { scroll-margin-top: 84px; }
.hero { padding: 56px 0 72px; background: radial-gradient(900px 420px at 88% -8%, color-mix(in srgb, var(--lime) 30%, transparent), transparent 70%), var(--bg); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 48px; align-items: center; }
.hero h1 { font-size: clamp(34px, 5.2vw, 58px); font-weight: 700; line-height: 1.06; margin: 18px 0; } .hl { color: var(--accent-text); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 500 13px var(--font-b); color: var(--accent-text); }
.lead { font-size: 18px; color: var(--muted); max-width: 56ch; margin-bottom: 26px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
.tag { margin: 24px 0; padding-left: 12px; border-left: 3px solid var(--lime); font: 600 17px var(--font-d); color: var(--accent-text); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0 0 10px; }
.stats dt { color: var(--muted); font-size: 13px; } .stats dd { margin: 2px 0 0; font: 600 clamp(18px, 3vw, 29px) var(--font-d); font-variant-numeric: tabular-nums; }
.hero-art { position: relative; max-width: 540px; width: 100%; margin-inline: auto; }
.hero-art > svg { width: 100%; height: auto; display: block; border-radius: 32px; box-shadow: 0 30px 60px rgba(18,61,53,.28); }
.float-chip { position: absolute; display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--fg); padding: 9px 14px 9px 10px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.2); animation: bob 5s ease-in-out infinite; }
.float-chip b { display: block; font-size: 13.5px; line-height: 1.25; } .float-chip span:not(.fc-ic) { color: var(--muted); font-size: 12px; }
.fc-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--forest); color: var(--lime); flex: none; } .fc-ic.lime { background: var(--lime); color: var(--forest); }
.fc1 { left: 12px; top: 16px; } .fc2 { right: 12px; top: 40%; animation-delay: -1.6s; } .fc3 { left: 20px; bottom: 90px; animation-delay: -3.2s; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.sec { padding: 72px 0; } .sec-alt { background: var(--surface-2); }
.sec-h { margin-bottom: 34px; max-width: 760px; } .sec-h.row { max-width: none; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
.sec-h h2, .sec-h-s h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 700; margin: 8px 0 10px; } .sec-h-s h2 { font-size: 24px; margin: 0 0 4px; } .sec-h-s { margin-bottom: 14px; }
.eyebrow { font: 600 12.5px var(--font-b); text-transform: uppercase; letter-spacing: .1em; color: var(--accent-text); }
.feat { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.feat-ic { width: 52px; height: 52px; border-radius: 16px; background: var(--forest); color: var(--lime); display: grid; place-items: center; flex: none; } .feat-ic.sm { width: 40px; height: 40px; border-radius: 12px; }
.feat .link { margin-top: auto; padding-top: 6px; }
.steps { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 18px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 8px; }
.step-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.step-n { width: 34px; height: 34px; border-radius: 50%; background: var(--lime); color: var(--forest); font: 700 15px var(--font-d); display: grid; place-items: center; }
.step-ic { color: var(--accent-text); }
.pad .chart { margin-top: 4px; }
.tiles { margin-top: 18px; } .tile { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.tile div { display: flex; flex-direction: column; } .tile b { font: 600 22px var(--font-d); } .tile span:not(.feat-ic) { color: var(--muted); font-size: 13px; }
.tile em { margin-left: auto; font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: var(--mute-bg); color: var(--muted); padding: 3px 8px; border-radius: 99px; }
.reward { padding: 18px; display: flex; flex-direction: column; gap: 8px; }

                  <button className="btn btn-sm btn-primary" onClick={() => advance(c)}>{c.status === 'Scheduled' ? 'Simulate: truck departs' : 'Simulate: mark collected'}</button>
                  <button className="btn btn-sm btn-ghost" onClick={() => cancel(c)}>Cancel</button>
                </div>
              )}
            </article>
          ))}
        </div>
        <div className="sticky-col"><div className="card pad"><div className="card-h"><h3>Live map</h3><span className="muted sm">Sample markers</span></div>
          <CityMap markers={markers} activeId={active} onSelect={setSel} />
          <div className="legend-row"><span><i style={{ background: '#2D8C74' }} /> Pickup address</span><span><i style={{ background: '#F59E0B' }} /> Truck on the way</span></div>
        </div></div>
      </div>
    </>
  );
}
function AdminCollections() {
  const { collections, setCollections, push } = useApp();
  const [f, setF] = useState('All');
  const list = collections.filter(c => f === 'All' || c.status === f);
  const upd = (id, patch, msg) => { setCollections(cs => cs.map(c => (c.id === id ? { ...c, ...patch } : c))); if (msg) push(msg); };
  return (
    <>
      <AHead title="Collections" sub="Assign collectors and track every pickup." />
      <div className="acard">
        <div className="acard-h"><h3>All pickups</h3><div className="fchips" role="group" aria-label="Filter by status">{['All', 'Scheduled', 'On the way', 'Completed', 'Cancelled'].map(s => <button key={s} className={cx('fchip', f === s && 'on')} onClick={() => setF(s)} aria-pressed={f === s}>{s}</button>)}</div></div>
        <div className="tbl-wrap"><table className="tbl dense"><thead><tr><th>ID</th><th>Citizen</th><th>When</th><th>Materials</th><th>Collector</th><th>Vehicle</th><th>Status</th><th /></tr></thead>
          <tbody>{list.map(c => (
            <tr key={c.id}><td><b>{c.id}</b></td><td>{c.owner}<div className="muted xs">{c.addr}</div></td><td>{c.date.replace('Today · ', 'Today ')}<div className="muted xs">{c.slot}</div></td>
              <td><div className="chips">{c.cats.map(k => <CatBadge key={k} k={k} small />)}</div></td>
              <td><select aria-label={`Collector for ${c.id}`} className="sel-s" value={c.collector} disabled={c.status === 'Completed' || c.status === 'Cancelled'} onChange={e => upd(c.id, { collector: e.target.value, vehicle: e.target.value === 'Unassigned' ? '—' : (c.vehicle !== '—' ? c.vehicle : 'Truck T-14') }, `${c.id} assigned to ${e.target.value}`)}>{COLLECTORS.map(n => <option key={n}>{n}</option>)}</select></td>
              <td><select aria-label={`Vehicle for ${c.id}`} className="sel-s" value={c.vehicle} disabled={c.collector === 'Unassigned' || c.status === 'Completed' || c.status === 'Cancelled'} onChange={e => upd(c.id, { vehicle: e.target.value }, `${c.id} now uses ${e.target.value}`)}>{FLEET.map(v => <option key={v}>{v}</option>)}</select></td>
              <td><Status s={c.status} /></td>
              <td>{NEXT_STATUS[c.status] ? <button className="btn btn-sm btn-ghost" onClick={() => upd(c.id, { status: NEXT_STATUS[c.status] }, `${c.id} is now ${NEXT_STATUS[c.status].toLowerCase()}`)}>→ {NEXT_STATUS[c.status]}</button> : null}</td></tr>
          ))}{list.length === 0 && <tr><td colSpan="8" className="muted center pad-s">Nothing in this state.</td></tr>}</tbody></table></div>
      </div>
    </>
  );
}

const FLEET = ['—', 'Truck T-09', 'Truck T-14', 'Van V-02'];

function Provider({ children }) {
  const [toasts, setToasts] = useState([]);
  const [points, setPoints] = useState(850);
  const [collections, setCollections] = useState(SEED_COLLECTIONS);
  const [modal, setModal] = useState(null);
  const [theme, setThemeState] = useState('system');
  useEffect(() => {
    const el = document.documentElement;
    if (theme === 'system') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', theme);
  }, [theme]);
  const push = useCallback((msg, kind = 'ok') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800);
  }, []);
  const addActivity = useCallback(() => {}, []);
  const value = { toasts, push, points, setPoints, addActivity, collections, setCollections, modal, setModal, theme, setTheme: setThemeState };
  return <Ctx.Provider value={value}>{children}</Ctx.Provider>;
}

function PickupModal() {
  const { modal, setModal, collections, setCollections, push } = useApp();
  const [cats, setCats] = useState([]);
  const [date, setDate] = useState(DATES[0]);
  const [slot, setSlot] = useState(SLOTS[0]);
  const [addr, setAddr] = useState('12 Rue Ibn Khaldoun, Ariana');
  const [note, setNote] = useState('');
  const [err, setErr] = useState({});
  const toggle = k => setCats(c => (c.includes(k) ? c.filter(x => x !== k) : [...c, k]));
  const submit = e => {
    e.preventDefault();
    const er = {};
    if (!cats.length) er.cats = 'Choose at least one waste category.';
    if (addr.trim().length < 5) er.addr = 'Enter the pickup address.';
    setErr(er);
    if (Object.keys(er).length) return;
    const id = 'C-' + (1056 + collections.length);
    setCollections([{ id, owner: 'You', date, slot, cats, status: 'Scheduled', collector: 'Unassigned', vehicle: '—', addr: addr.trim(), x: 36, y: 38 }, ...collections]);
    push(`Pickup ${id} requested for ${date}`);
    setCats([]); setNote(''); setErr({}); setModal(null);
  };
  return (
    <Modal open={modal === 'pickup'} onClose={() => setModal(null)} title="Request a pickup" sub="Collectors are assigned the evening before. This is a demo, so nothing is sent.">
      <form onSubmit={submit} noValidate className="stack">
        <Field id="pk-cats" label="What are you putting out?" error={err.cats}>
          <div className="chips" id="pk-cats">{Object.keys(CATS).map(k => <CatBadge key={k} k={k} active={cats.includes(k)} onClick={() => toggle(k)} />)}</div>
        </Field>
        <div className="grid g2">
          <Field id="pk-date" label="Date"><select id="pk-date" value={date} onChange={e => setDate(e.target.value)}>{DATES.map(d => <option key={d}>{d}</option>)}</select></Field>
          <Field id="pk-slot" label="Time slot"><select id="pk-slot" value={slot} onChange={e => setSlot(e.target.value)}>{SLOTS.map(d => <option key={d}>{d}</option>)}</select></Field>
        </div>
        <Field id="pk-addr" label="Pickup address" error={err.addr}><input id="pk-addr" value={addr} onChange={e => setAddr(e.target.value)} /></Field>
        <Field id="pk-note" label="Note for the collector" hint="Optional"><textarea id="pk-note" rows="2" value={note} onChange={e => setNote(e.target.value)} placeholder="Bags are by the gate" /></Field>
        <div className="modal-f"><button type="button" className="btn btn-ghost" onClick={() => setModal(null)}>Cancel</button><button className="btn btn-primary" type="submit">Request pickup</button></div>
      </form>
    </Modal>
  );
}

function Root() {
  const [view, setView] = useState('citizen');
  return (
    <div className="main">
      <header className="top"><div className="top-in gut">
        <b style={{ fontFamily: 'var(--font-d)' }}>EcoLoop · Pickups &amp; Vehicles</b>
        <Seg label="View" value={view} onChange={setView} options={[{ v: 'citizen', l: 'Citizen: My Collections' }, { v: 'admin', l: 'Admin: Collections & vehicles' }]} />
        <div className="top-act"><ThemeBtn /></div>
      </div></header>
      <main className="content gut" id="main">{view === 'citizen' ? <Collections /> : <AdminCollections />}</main>
      <PickupModal />
      <Toasts />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Provider><Root /></Provider>);

</script>
