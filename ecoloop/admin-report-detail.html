<script>
const CATS={plastic:['Plastic','#3B82F6'],paper:['Paper','#E59A12'],glass:['Glass','#12A89A'],metal:['Metal','#8393A7'],organic:['Organic','#6DB33F'],electronics:['Electronics','#8B5CF6']};
const KIND={'Pending':'warn','In review':'info','Assigned':'info','Resolved':'ok'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=(k,sm)=>{const c=CATS[k]||[k,'#8393A7'];return `<span class="cat${sm?' cat-sm':''}" style="--c:${c[1]}">${esc(c[0])}</span>`;};
const badge=s=>`<span class="badge b-${KIND[s]||'mute'}"><i></i>${esc(s)}</span>`;
const STAT=['Pending','In review','Assigned','Resolved'];
const id=new URLSearchParams(location.search).get('id');
const box=document.getElementById('detail');
function load(){
  if(!id){box.textContent='Open a report from the list.';return;}
  fetch('index.php?r=api.reports&id='+encodeURIComponent(id)).then(r=>r.json()).then(r=>{
    if(!r){box.textContent='Report not found.';return;}
    document.querySelector('.a-head h1').textContent='Report '+r.id;
    const cr=document.querySelector('.crumb b'); if(cr) cr.textContent='Report '+r.id;
    box.innerHTML=`<div class="row between">${cat(r.cat)}${badge(r.status)}</div>
      <ul class="kv"><li><span>Location</span><b>${esc(r.loc)}</b></li><li><span>Reported by</span><b>${esc(r.by)}</b></li><li><span>Date</span><b>${esc(r.date)}</b></li><li><span>Preference</span><b>${esc(r.pref)}</b></li></ul>
      <div><p class="label">Description</p><p>${esc(r.desc)}</p></div>
      <div><p class="label">Change status</p><div class="stat-btns">${STAT.map(s=>`<button type="button" class="btn btn-sm ${r.status===s?'btn-primary':'btn-ghost'}" data-s="${s}">${s}</button>`).join('')}</div></div>`;
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>
      fetch('index.php?r=admin.status',{method:'POST',body:new URLSearchParams({id:r.id,status:b.dataset.s})}).then(load));
  }).catch(()=>{box.textContent='Could not load the report.';});
}
load();
</script>
